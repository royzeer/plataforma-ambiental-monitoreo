# ================================================================
#  Módulo de Monitoreo Ambiental - configuración
#  Usa la misma base de datos de la API del proyecto (impacto_ambiental_db)
# ================================================================
spring.application.name=plataforma-ambiental-monitoreo
server.port=8081

# --- MySQL (cambiar usuario y contraseña según su equipo) ---
spring.datasource.url=jdbc:mysql://localhost:3306/impacto_ambiental_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Las tablas ya existen (database/schema.sql), Hibernate no las modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Mensajes y formato
spring.messages.encoding=UTF-8
spring.thymeleaf.cache=false
spring.mvc.format.date=yyyy-MM-dd
server.servlet.session.tracking-modes=cookie
